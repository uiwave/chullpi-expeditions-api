server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  jpa:
    hibernate:
      ddl-auto: update # Permite crear/actualizar la estructura automáticamente en prod
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN