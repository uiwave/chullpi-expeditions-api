server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: chullpi-expeditions-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:api_db}
    username: ${DB_USER:api_user}
    password: ${DB_PASS:}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  issuer: ${JWT_ISSUER:chullpi-expeditions-api}

google:
  client-id: ${CLIENT_ID:unconfigured-client-id}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    email: ${ADMIN_EMAIL:admin@chullpi.com}
    password: ${ADMIN_PASSWORD:Admin123!}
