services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chullpi-expeditions-api
    ports:
      - "${APP_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-api_db}
      DB_USER: ${DB_USER:-api_user}
      DB_PASS: ${DB_PASS:?DB_PASS es obligatorio}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-none}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:17-alpine
    container_name: chullpi-expeditions-db
    environment:
      POSTGRES_DB: ${DB_NAME:-api_db}
      POSTGRES_USER: ${DB_USER:-api_user}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS es obligatorio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-api_user} -d ${DB_NAME:-api_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
